name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting

        - Check the [Configuration](https://github.com/arboeh/slABton?tab=readme-ov-file#configuration) section
        - Search [existing issues](https://github.com/arboeh/slABton/issues)
        - Verify you are using the latest version

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of the bug
      placeholder: 'When I swipe the handle in lock mode, the lock is not triggered...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Card Version
      placeholder: '0.1.0'
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      placeholder: '2026.11.0'
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / Companion App
      description: Which browser or Home Assistant Companion App are you using?
      placeholder: 'Chrome 130, iOS Companion App, etc.'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Numbered steps to reproduce the issue
      placeholder: |
        1. Add the card to a dashboard
        2. Set entity to lock.front_door
        3. Swipe the handle
        4. Observe the bug
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Card Configuration
      description: Paste your card YAML (redact any secrets, never include alarm codes)
      placeholder: |
        type: custom:slabton-card
        entity: lock.front_door
        mode: lock
      render: yaml
    validations:
      required: false

  - type: textarea
    id: console_log
    attributes:
      label: Console Logs
      description: |
        Open browser dev tools (F12) and paste any relevant console output here.
        If there are no errors, write "none".
      render: yaml
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues
          required: true
        - label: I have verified this is not a configuration issue
          required: true
        - label: I have tested with a minimal configuration
          required: false
