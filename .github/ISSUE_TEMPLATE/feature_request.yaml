name: ✨ Feature Request
description: Suggest an idea or improvement
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting

        - Check the roadmap in the [README](https://github.com/arboeh/slABton?tab=readme-ov-file#roadmap)
        - Search [existing issues](https://github.com/arboeh/slABton/issues)

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What are you trying to achieve that is not possible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How should it work? Include example YAML if you can.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and the roadmap
          required: true
