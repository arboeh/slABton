name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Build bundle
        run: npm run build

      - name: Check version consistency
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # package.json, src/version.js and the bundle banner must agree
          node scripts/check-version.cjs

          # Tag must match package.json (non-pre-release tags only)
          if [[ "$TAG" != *-* ]]; then
            VERSION=$(node -p "require('./package.json').version")
            if [ "v$VERSION" != "$TAG" ]; then
              echo "Tag $TAG does not match package.json version $VERSION" >&2
              exit 1
            fi
          fi

      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/extract-release-notes.cjs "$TAG"

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: dist/slabton.js
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
